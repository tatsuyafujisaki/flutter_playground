on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - id: my-cache
        uses: actions/cache@v5
        with:
          path: ~/flutter
          key: ${{ runner.os }}-flutter-stable
      - if: steps.my-cache.outputs.cache-hit != 'true'
        run: git clone --depth 1 --branch stable https://github.com/flutter/flutter.git $HOME/flutter
      - run: echo "$HOME/flutter/bin" >> $GITHUB_PATH
      - uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-
      - name: Create Firebase Options files
        env:
          FIREBASE_OPTIONS_DEV_BASE64: ${{ secrets.FIREBASE_OPTIONS_DEV_BASE64 }}
          FIREBASE_OPTIONS_PROD_BASE64: ${{ secrets.FIREBASE_OPTIONS_PROD_BASE64 }}
        run: |
          echo "$FIREBASE_OPTIONS_DEV_BASE64" | base64 --decode > lib/firebase_options_dev.dart
          echo "$FIREBASE_OPTIONS_PROD_BASE64" | base64 --decode > lib/firebase_options_prod.dart
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output none --set-exit-if-changed .
      - run: flutter analyze --fatal-infos
      - run: test ! -d test || flutter test
