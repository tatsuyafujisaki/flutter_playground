name: flutter_playground
publish_to: none
version: 1.0.0+1
environment:
  sdk: ^3.10.0
# > The version constraint is optional but recommended. If no version constraint is given, any is assumed.
# https://dart.dev/tools/pub/dependencies#hosted-packages
dependencies:
  archive: any
  async: any
  cached_network_image: any
  collection: any
  device_info_plus: any
  firebase_analytics: any
  firebase_core: any
  firebase_crashlytics: any
  firebase_ui_firestore: any
  flutter:
    sdk: flutter
  flutter_launcher_icons: any
  flutter_local_notifications: any
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: any
  flutter_slidable: any
  flutter_svg: any
  freezed_annotation: any
  gal: any
  geolocator: any
  glob: any
  google_maps_flutter: any
  googleapis: any
  http: any
  image_picker: any
  intl: any
  json_annotation: any
  location: any
  path: any
  path_provider: any
  permission_handler: any
  riverpod_annotation: any
  shared_preferences: any
  upgrader: any
  url_launcher: any
  video_player: any
  webview_flutter: any
dev_dependencies:
  build_runner: any
  flutter_lints: any
  flutter_test:
    sdk: flutter
  freezed: any
  json_serializable: any
  riverpod_generator: any
  riverpod_lint: any
flutter:
  generate: true # https://docs.flutter.dev/ui/internationalization#adding-your-own-localized-messages
  uses-material-design: true
